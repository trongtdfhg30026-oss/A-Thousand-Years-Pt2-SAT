<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Thousand Years (Pt. 2) - SAT</title>
  <!-- ABCjs Basic Library -->
  <script src="abcjs-basic-min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <!-- AUDIO PLAYER -->
  <audio id="audio-player" src="vocal.mp3" preload="auto"></audio>
  <input type="file" id="audio-file-input" accept="audio/*" style="display:none">

  <!-- TOP DECK: STICKY HEADER, CONTROLS & LIVE KARAOKE HUD -->
  <header class="top-deck">
    <!-- DECK HEADER -->
    <div class="deck-header">
      <div class="song-title-group">
        <h1>A Thousand Years (Pt. 2)</h1>
        <div class="meta">
          <span>Christina Perri ft. Steve Kazee</span>
        </div>
      </div>

      <!-- SINGER LEGEND (3 BÈ SAT) -->
      <div class="vocal-legend">
        <span class="legend-chip chip-soprano">🔴 Nữ 1</span>
        <span class="legend-chip chip-alto">🟣 Nữ 2</span>
        <span class="legend-chip chip-tenor">🔵 Nam</span>
        <span class="legend-chip chip-trio">🟡 Tam ca</span>
      </div>
    </div>

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="transport-buttons">
        <button class="btn-play" id="btn-play" onclick="togglePlay()">
          <span id="play-icon">▶</span>
          <span id="play-text">Phát</span>
        </button>
        <button class="btn-ctrl" onclick="seekRelative(-5)" title="Tua -5s">⏪ 5s</button>
        <button class="btn-ctrl" onclick="seekRelative(5)" title="Tua +5s">⏩ 5s</button>
        <button class="btn-ctrl" id="btn-autoscroll" onclick="toggleAutoScroll()" title="Tự động cuộn theo sheet">📜 Cuộn: Tắt</button>
      </div>

      <div class="timeline-wrapper">
        <div class="progress-bar-container" id="seek-bar" onclick="handleSeekClick(event)" title="Tua nhạc">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div class="time-text" id="time-display">00:00 / 05:00</div>
      </div>

      <div class="right-tools">
        <div class="audio-mode-selector" id="audio-mode-group">
          <button class="mode-btn active" id="btn-mode-vocal" onclick="switchAudioMode('vocal')">🎤 Có lời</button>
          <button class="mode-btn" id="btn-mode-inst" onclick="switchAudioMode('instrumental')">🎵 Beat</button>
          <button class="mode-btn" id="btn-mode-video" onclick="switchAudioMode('video')">🎬 Video</button>
        </div>
        <div class="zoom-group">
          <button class="zoom-btn" onclick="changeZoom(-0.1)" title="Thu nhỏ">−</button>
          <span class="zoom-text" id="zoom-text">100%</span>
          <button class="zoom-btn" onclick="changeZoom(0.1)" title="Phóng to">+</button>
        </div>
        <a href="A_Thousand_Years_Pt2_Sheet_Music_3Be_SAT.pdf" download class="btn-ctrl btn-download-pdf" title="Tải PDF">📥 PDF</a>
        <button class="btn-ctrl" onclick="window.print()" title="In sheet">🖨 In</button>
      </div>
    </div>

    <!-- LIVE KARAOKE APP LYRIC SCREEN -->
    <div class="live-karaoke-hud" id="live-hud">
      <div class="karaoke-screen">
        <div class="karaoke-line line-prev" id="hud-prev"></div>
        <div class="karaoke-line line-active" id="hud-lyric">Sẵn sàng...</div>
        <div class="karaoke-line line-next" id="hud-next">The day we met (00:20)</div>
      </div>
      <div class="karaoke-voice-split" id="hud-voice-split">
        <div class="split-item voice-sop" id="split-sop"><span class="badge-dot dot-sop"></span> N1: <span>—</span></div>
        <div class="split-item voice-alt" id="split-alt"><span class="badge-dot dot-alt"></span> N2: <span>—</span></div>
        <div class="split-item voice-ten" id="split-ten"><span class="badge-dot dot-ten"></span> Nam: <span>—</span></div>
      </div>
    </div>
  </header>

  <!-- SHEET MUSIC SCORE DISPLAY -->
  <main class="sheet-wrapper">
    <div class="sheet-paper-card">
      <div id="sheet-paper"></div>
    </div>
  </main>

  <!-- APPLICATION SCRIPTS -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
