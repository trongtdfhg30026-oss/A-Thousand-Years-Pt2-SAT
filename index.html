<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Thousand Years (Pt. 2) - SAT 3 Bè</title>
  <!-- ABCjs Basic Library -->
  <script src="abcjs-basic-min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="app.css?v=20261027_05">
</head>

<body>
  <!-- AUDIO PLAYER -->
  <audio id="audio-player" src="vocal.mp3" preload="auto"></audio>

  <!-- TOP BAR: MINIMAL CONTROLS -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="song-header">
        <h1 class="song-title">A Thousand Years (Pt. 2)</h1>
        <span class="song-artist">Bản phối 3 Bè SAT (Nữ 1 Cao • Nữ 2 Trầm • Nam Cao)</span>
      </div>
      <div class="transport-group">
        <button class="btn-play" id="btn-play" onclick="togglePlay()" title="Phát / Dừng">
          <span id="play-icon">▶</span>
          <span id="play-text">Phát</span>
        </button>
        <button class="btn-tool" onclick="seekRelative(-5)" title="Tua lùi 5s">⏪ 5s</button>
        <button class="btn-tool" onclick="seekRelative(5)" title="Tua tới 5s">⏩ 5s</button>
      </div>
    </div>

    <!-- TIMELINE & PROGRESS -->
    <div class="top-bar-center">
      <div class="seek-container" id="seek-bar" onclick="handleSeekClick(event)" title="Tua đến vị trí">
        <div class="seek-progress" id="progress-bar"></div>
      </div>
      <div class="time-readout" id="time-display">00:00 / 05:00</div>
    </div>

    <!-- RIGHT TOOLS -->
    <div class="top-bar-right">
      <div class="audio-switcher">
        <button class="mode-btn active" id="btn-mode-vocal" onclick="switchAudioMode('vocal')">🎤 Có lời</button>
        <button class="mode-btn" id="btn-mode-inst" onclick="switchAudioMode('instrumental')">🎵 Beat</button>
      </div>
      <button class="btn-tool" id="btn-autoscroll" onclick="toggleAutoScroll()" title="Tự động cuộn theo bài">📜 Cuộn: Tắt</button>
      <div class="zoom-controls">
        <button class="btn-zoom" onclick="changeZoom(-0.1)" title="Thu nhỏ sheet">−</button>
        <span class="zoom-level" id="zoom-text">100%</span>
        <button class="btn-zoom" onclick="changeZoom(0.1)" title="Phóng to sheet">+</button>
      </div>
      <a href="A_Thousand_Years_Pt2_Sheet_Music_3Be_SAT.pdf" download class="btn-tool btn-pdf" title="Tải PDF khổ A4 chuẩn">📥 PDF</a>
      <button class="btn-tool" onclick="window.print()" title="In bản nhạc">🖨 In</button>
    </div>
  </header>

  <!-- MAIN 2-COLUMN WORKSPACE: LEFT = VERTICAL LYRICS, RIGHT = SHEET MUSIC -->
  <main class="main-workspace">
    <!-- LEFT COLUMN: VERTICAL LYRICS STREAM (SPOTIFY / APPLE MUSIC STYLE) -->
    <section class="lyrics-column" id="lyrics-column-panel">
      <div class="column-header">
        <span class="header-tag">DÒNG LỜI HÁT (CHẠY DỌC)</span>
        <div class="legend-mini">
          <span class="dot-legend dot-n1" title="Nữ 1 (Cao)">🔴 Nữ 1 (Cao)</span>
          <span class="dot-legend dot-n2" title="Nữ 2 (Trầm)">🟣 Nữ 2 (Trầm)</span>
          <span class="dot-legend dot-nam" title="Nam (Cao)">🔵 Nam (Cao)</span>
          <span class="dot-legend dot-trio" title="Hòa ca">🟡 Hòa ca</span>
          <span class="dot-legend dot-climax" title="Cao trào">🔥 Cao trào</span>
        </div>
      </div>
      <div class="lyrics-stream" id="lyrics-stream">
        <!-- Rendered dynamically by app.js -->
      </div>
    </section>

    <!-- RIGHT COLUMN: SHEET MUSIC (3-STAVE SAT SCORE) -->
    <section class="sheet-column" id="sheet-column-panel">
      <div class="sheet-paper-container">
        <div id="sheet-paper"></div>
      </div>
    </section>
  </main>

  <!-- SCRIPTS -->
  <script src="data.js?v=20261027_05"></script>
  <script src="app.js?v=20261027_05"></script>
</body>
</html>
