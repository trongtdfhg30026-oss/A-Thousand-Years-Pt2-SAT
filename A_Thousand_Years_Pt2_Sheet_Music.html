<!DOCTYPE html>

<head>

<title>A Thousand Years (Pt. 2) - Bản Sheet Nhạc 3 Bè</title>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/abcjs-audio.css">
<style>
  :root {
    --soprano: #d81b60;
    --alto: #5e35b1;
    --tenor: #0277bd;
    --bg: #f8fafc;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: #1e293b;
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 32px;
  }
  header {
    text-align: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 20px;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0 0 8px 0;
    font-size: 28px;
    color: #0f172a;
  }
  .meta {
    color: #64748b;
    font-size: 15px;
  }
  .roles {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .role-badge {
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #fff;
  }
  .role-soprano { background: var(--soprano); }
  .role-alto { background: var(--alto); }
  .role-tenor { background: var(--tenor); }
  
  .controls-panel {
    background: #f1f5f9;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn:hover { background: #1d4ed8; }
  .btn-print { background: #059669; }
  .btn-print:hover { background: #047857; }
  
  #audio-player {
    width: 100%;
    margin-top: 12px;
  }
  #sheet-paper {
    width: 100%;
    overflow-x: auto;
    background: #fff;
    padding: 10px;
  }
  
  /* ABCjs coloring for voices */
  .abcjs-v0 { fill: var(--soprano); stroke: var(--soprano); }
  .abcjs-v1 { fill: var(--alto); stroke: var(--alto); }
  .abcjs-v2 { fill: var(--tenor); stroke: var(--tenor); }
  .abcjs-staff { stroke: #475569 !important; fill: none !important; }
  .abcjs-bar { stroke: #334155 !important; }
  
  @media print {
    body { background: white; padding: 0; }
    .container { box-shadow: none; padding: 0; max-width: 100%; }
    .controls-panel { display: none; }
  }
</style>

function render() {
  var visualObj = ABCJS.renderAbc("sheet-paper", fullAbc, {
    responsive: "resize",
    scale: 0.95,
    staffwidth: 980,
    add_classes: true
  })[0];

  if (ABCJS.synth.supportsAudio()) {
    var synthControl = new ABCJS.synth.SynthController();
    synthControl.load("#audio-player", null, {
      displayRestart: true,
      displayPlay: true,
      displayProgress: true,
      displayWarp: true
    });
    
    var createSynth = new ABCJS.synth.CreateSynth();
    createSynth.init({ visualObj: visualObj }).then(function() {
      synthControl.setTune(visualObj, true).then(function() {
        console.log("Audio player ready");
      });
    }).catch(function(error) {
      console.warn("Audio synth error:", error);
    });
  }
}

window.addEventListener("load", render);
</script>
